name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SAMPLE_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Tests (no network, no Zetaris, no Nightshift)
        run: python -m pytest -q
      - name: Offline evaluation
        run: python run.py eval
      - name: One run from the JSON contract
        run: python run.py run input_examples/example_1.json --out /tmp/out.json
