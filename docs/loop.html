<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">

      <circle cx="335" cy="496" r="6"/><circle cx="355" cy="496" r="6"/><circle cx="375" cy="496" r="6"/><circle cx="395" cy="496" r="6"/><circle cx="415" cy="496" r="6"/><circle cx="435" cy="496" r="6"/><circle cx="455" cy="496" r="6"/><circle cx="475" cy="496" r="6"/><circle cx="495" cy="496" r="6"/>

    <text x="415" y="562" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.8">95% CI; you save what works</text>
  </g>
